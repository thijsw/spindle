name: Site

# Publishes site/ to GitHub Pages whenever it changes. The Sparkle appcast
# lives on the same Pages site (written by the Release workflow), so the
# currently published feed is carried over untouched.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          # Keep the auto-update feed the Release workflow published.
          curl -sfL "https://thijsw.github.io/spindle/appcast.xml" -o _site/appcast.xml \
            || echo "no published appcast yet"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
